spring:
  application:
    name: secondhand-electronics-trading
  
  datasource:
    url: jdbc:h2:mem:secondhand_electronics;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  h2:
    console:
      enabled: true
      path: /h2-console
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

# JWT配置
jwt:
  secret: your-secret-key-change-this-in-production-at-least-256-bits
  expiration: 86400000 # 24小时（毫秒）

# 文件上传路径
file:
  upload-dir: ./uploads

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api

# 日志配置
logging:
  level:
    com.secondhand.electronics: DEBUG
    org.springframework.security: DEBUG